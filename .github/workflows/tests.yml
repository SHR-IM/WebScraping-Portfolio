name: Python web scraping regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install "Scrapy>=2.11,<3"
      - name: Compile spider and tests
        run: python -m compileall -q StackExchangeAnalysis/StackExPoliticsSpider.py tests
      - name: Run offline scraper tests
        run: python -m unittest discover -s tests -v
